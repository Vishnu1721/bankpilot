<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LegacyBank Admin</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
    LegacyBank Administration Console
</div>

<div class="container">

    <h2>Member Search</h2>

    <p>Enter a member number to retrieve account information.</p>

    <form action="/member" method="post">

        <table>
            <tr>
                <td>Member Number</td>

                <td>
                    <input
                        type="text"
                        name="member_id"
                        autocomplete="off">
                </td>
            </tr>
        </table>

        <button type="submit">Search</button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
