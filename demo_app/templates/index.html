<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>LegacyBank Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="header">LegacyBank Credit Union Console</div>
<div class="container"><div class="eyebrow">MEMBER SERVICING</div><h2>Member Search</h2>
<p>Enter a member number to retrieve account information.</p>
<form action="/member" method="post">
<label for="member_id">Member Number</label>
<input id="member_id" type="text" name="member_id" autocomplete="off">
<button type="submit">Search</button></form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</div></body></html>
