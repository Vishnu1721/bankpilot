<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Create Sub-account</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="header"><div><span class="brand-mark">LB</span> LegacyBank Credit Union</div><a class="header-link" href="/">Operations</a></header>
<main class="container form-page"><div class="eyebrow">ACCOUNT SERVICES · DRAFT</div>
<h1>Create Sub-account</h1>
<p>Enter the details directly. Nothing is opened until final human approval.</p>
<form action="{{ url_for('review_subaccount') }}" method="post">
<label for="member_id">Member Number</label>
<input id="member_id" name="member_id" type="text" value="{{ member_id or '' }}" autocomplete="off" required>
{% if member %}<small>Selected member: {{ member.name }}</small>{% endif %}
<label for="account_type">Account Type</label>
<select id="account_type" name="account_type" required>
<option value="">Choose an account type</option><option>Holiday Savings</option>
<option>Money Market</option><option>Certificate</option></select>
<label for="nickname">Account Nickname</label>
<input id="nickname" name="nickname" type="text" placeholder="Optional nickname">
<button type="submit">Continue to Review</button></form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</main></body></html>
