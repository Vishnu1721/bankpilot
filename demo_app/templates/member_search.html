<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Member Lookup</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="header"><div><span class="brand-mark">LB</span> LegacyBank Credit Union</div><a class="header-link" href="/">Operations</a></header>
<main class="container form-page"><div class="eyebrow">MEMBER SERVICES</div><h1>Member Lookup</h1>
<p>Search independently by member number.</p>
<form action="{{ url_for('find_member') }}" method="post">
<label for="member_id">Member Number</label>
<input id="member_id" type="text" name="member_id" autocomplete="off" required>
<button type="submit">Search Member</button></form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</main></body></html>
